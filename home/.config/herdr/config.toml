onboarding = false
[ui]
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
rows = [["state_icon", "machine", "workspace", "agent"]]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace", "branch", "git_status"]]

[theme]
name = "dracula"
auto_switch = false

[experimental]
pane_history = true

[keys]
prefix = "ctrl+space"
toggle_sidebar = "cmd+b"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "open"
